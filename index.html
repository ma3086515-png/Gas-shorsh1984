<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مطعم گه س شورش - الطلب</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f6f6f6;color:#222}
header{background:#111;color:#fff;padding:22px;text-align:center}
main{max-width:700px;margin:auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:14px 0}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:bold;cursor:pointer}
.add{background:#111;color:#fff}.send{background:#20b958;color:#fff;width:100%;font-size:18px}
input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px}
.small{color:#777;font-size:13px}
#location{background:#eee;color:#333;width:100%;margin:8px 0}
</style>
</head>
<body>
<header>
<h1>مطعم گه س شورش 🍽️</h1>
<div>اختر طلبك وأرسل موقع التوصيل</div>
</header>
<main>
<div class="card">
<h2>قائمة الطعام</h2>
<p class="small">يمكنك تعديل الأصناف والأسعار لاحقًا.</p>
<div class="item"><span>الصنف الأول — 0 د.ع</span><button class="add" onclick="add('الصنف الأول',0)">إضافة</button></div>
<div class="item"><span>الصنف الثاني — 0 د.ع</span><button class="add" onclick="add('الصنف الثاني',0)">إضافة</button></div>
<div class="item"><span>الصنف الثالث — 0 د.ع</span><button class="add" onclick="add('الصنف الثالث',0)">إضافة</button></div>
</div>

<div class="card">
<h2>بيانات التوصيل</h2>
<input id="name" placeholder="اسم الزبون">
<input id="phone" placeholder="رقم الهاتف">
<button id="location" onclick="getLocation()">📍 إرسال موقعي</button>
<div id="locText" class="small">لم يتم تحديد الموقع بعد.</div>
</div>

<div class="card">
<h2>طلبك</h2>
<div id="cart">السلة فارغة.</div>
<h3 id="total">المجموع: 0 د.ع</h3>
<button class="send" onclick="sendOrder()">إرسال الطلب عبر واتساب 🟢</button>
</div>
</main>
<script>
const cart=[]; let lat=null,lon=null;
function add(name,price){
 let x=cart.find(i=>i.name===name);
 if(x)x.qty++;else cart.push({name,price,qty:1});
 render();
}
function render(){
 let el=document.getElementById('cart');
 if(!cart.length){el.textContent='السلة فارغة.';document.getElementById('total').textContent='المجموع: 0 د.ع';return}
 let total=0;
 el.innerHTML=cart.map(i=>{total+=i.price*i.qty;return `<div>${i.name} × ${i.qty} — ${(i.price*i.qty).toLocaleString()} د.ع</div>`}).join('');
 document.getElementById('total').textContent='المجموع: '+total.toLocaleString()+' د.ع';
}
function getLocation(){
 if(!navigator.geolocation){alert('المتصفح لا يدعم تحديد الموقع.');return}
 navigator.geolocation.getCurrentPosition(p=>{
  lat=p.coords.latitude;lon=p.coords.longitude;
  document.getElementById('locText').textContent='تم تحديد الموقع ✅';
 },()=>alert('يرجى السماح للموقع من المتصفح.'));
}
function sendOrder(){
 if(!cart.length)return alert('اختر صنفًا واحدًا على الأقل.');
 const name=document.getElementById('name').value.trim();
 const phone=document.getElementById('phone').value.trim();
 if(!name||!phone)return alert('يرجى إدخال الاسم ورقم الهاتف.');
 if(lat===null)return alert('يرجى الضغط على «إرسال موقعي» أولًا.');
 let total=cart.reduce((s,i)=>s+i.price*i.qty,0);
 let lines=cart.map(i=>`- ${i.name} × ${i.qty}`).join('\n');
 let msg=`🍽️ طلب جديد - مطعم گه س شورش\n\nالاسم: ${name}\nالهاتف: ${phone}\n\nالطلب:\n${lines}\n\nالمجموع: ${total.toLocaleString()} د.ع\n📍 موقع التوصيل:\nhttps://www.google.com/maps?q=${lat},${lon}`;
 location.href='https://wa.me/9647504482204?text='+encodeURIComponent(msg);
}
</script>
</body>
</html>
